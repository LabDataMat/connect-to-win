<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081120" />
    <title>接通就赢</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #081120;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        display: block;
        width: 100%;
        /* 用 100% 而不是 100vh：iOS Safari 的 100vh 包含被地址栏遮挡的部分，会导致画面被裁切 */
        height: 100%;
        touch-action: none;
        user-select: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        color: rgba(140, 163, 194, 0.55);
        font: 12px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">接通就赢 · 网页版</div>
    <script src="./game.js"></script>
  </body>
</html>
