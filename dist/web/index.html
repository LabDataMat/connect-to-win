<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#081120" />
    <title>接通就赢</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #081120;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        user-select: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        color: rgba(140, 163, 194, 0.55);
        font: 12px/1.6 "PingFang SC", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">本地预览模式 · 微信小游戏版通过 dist/wxgame 构建</div>
    <script src="./game.js"></script>
  </body>
</html>
